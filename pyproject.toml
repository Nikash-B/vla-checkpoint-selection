[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ckpt_selection"
version = "1.0.0"

[tool.setuptools]
packages = ["ckpt_selection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D1", "D205", "D209"]

[tool.ruff.lint.isort]
known-first-party = ["ckpt_selection"]
